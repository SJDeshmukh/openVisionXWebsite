name: Deploy website to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openvisionx-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::532025488693:role/openvisionx-github-deploy
          role-session-name: openvisionx-github-deploy
          aws-region: us-east-1

      - name: Deploy website assets to S3
        run: aws s3 sync dist/ s3://openvisionx/ --delete --only-show-errors --exclude "index.html" --cache-control "public,max-age=3600"

      - name: Deploy uncached application shell
        run: |
          aws s3 cp dist/index.html s3://openvisionx/index.html --only-show-errors --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8"
